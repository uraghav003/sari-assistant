version: '3.8'

services:
  sari-app:
    build: .
    container_name: sari-sovereign-app
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: always

  kepler-telemetry:
    image: quay.io/sustainable_computing_io/kepler:latest
    container_name: sari-kepler-telemetry
    privileged: true
    pid: host
    ports:
      - "9103:9103"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/class/powercap:/sys/class/powercap:ro
      - /lib/modules:/lib/modules:ro
    restart: always
