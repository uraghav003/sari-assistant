# RuFlo V3 Runtime Configuration
# Generated: 2026-10-26T13:15:55.662Z

version: "3.0.0"

swarm:
  topology: hierarchical-mesh
  maxAgents: 15
  autoScale: true
  coordinationStrategy: consensus

memory:
  backend: hybrid
  enableHNSW: true
  # Store location is read from claude-flow.config.json (memory.persistPath);
  # this YAML file is runtime/daemon configuration only.
  cacheSize: 100
  # ADR-049: Self-Learning Memory
  learningBridge:
    enabled: true
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: true
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: true
    defaultScope: project

neural:
  enabled: true
  modelPath: .claude-flow/neural

models:
  tiers:
    routing: claude-haiku-4-5
    default: claude-sonnet-4-5
    complex: claude-opus-4-6
    security: claude-opus-4-6
  fallback:
    enabled: true
    chain: [claude-sonnet-4-5, claude-haiku-4-5]

hooks:
  enabled: true
  autoExecute: true

mcp:
  autoStart: false
  port: 3000
